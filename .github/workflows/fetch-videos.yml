name: Fetch Defensie YouTube Videos

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest videos
        run: python yt_video_defensie_fetcher.py

      - name: Commit and push changed CSV files
        run: |
          if git diff --quiet -- yt_defensie/; then
            echo "No video changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yt_defensie/
          git commit -m "Update Defensie videos"
          git push
