name: Update Defensie magazines feed

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch latest editions
        run: python scripts/update_magazine_feed.py
      - name: Commit changed feeds
        run: |
          if git diff --quiet -- data/defensie-magazines.json data/defensie_magazines.csv; then
            echo "No magazine changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/defensie-magazines.json data/defensie_magazines.csv
          git commit -m "Update Defensie magazine editions"
          git push
